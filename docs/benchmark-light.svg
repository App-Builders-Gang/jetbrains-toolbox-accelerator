<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 426" width="1280" height="426" role="img" aria-labelledby="ttl dsc"><title id="ttl">Measured throughput before and after jtaccel</title><desc id="dsc">Panel one: Toolbox as it ships reaches 1.5 MB/s while jtaccel reaches 8.5 MB/s on the same line. Panel two: on Android Studio’s CDN a single connection reaches 2.3 MB/s and six connections reach 7.8 MB/s against a line capacity of 8.5 MB/s. Panel three: time to first byte is 16 seconds with 8 MiB segments and 0.94 seconds with 1 MiB segments.</desc><style>@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}@keyframes flow{to{transform:translateX(var(--period))}}@keyframes fade{from{opacity:0}to{opacity:1}}@keyframes pkt{to{stroke-dashoffset:-150}}.bar{transform-box:fill-box;transform-origin:left center;animation:grow 1.5s cubic-bezier(.22,.9,.25,1) both}.flow{animation:flow var(--dur) linear infinite}.fade{animation:fade .8s ease-out both}.pkt{animation:pkt 1.2s linear infinite}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Roboto,'Helvetica Neue',Arial,sans-serif"><defs><linearGradient id="blightf" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FF8618"/><stop offset=".55" stop-color="#FC2771"/><stop offset="1" stop-color="#B51EEB"/></linearGradient></defs><rect width="1280" height="426" rx="18" fill="#ffffff"/><rect x=".5" y=".5" width="1279" height="425" rx="17.5" fill="none" stroke="#d1d9e0"/><text x="40" y="52" font-size="19" font-weight="700" fill="#1f2328">Measured on one 8.5 MB/s line, same file, same evening</text><text x="40" y="76" font-size="14" fill="#59636e">Aggregate bandwidth was never the limit — a single TCP stream was.</text><rect x="40" y="104" width="386" height="286" rx="14" fill="#f6f8fa" stroke="#d1d9e0"/><text x="62" y="138" font-size="15" font-weight="700" fill="#1f2328">End-to-end Toolbox download</text><text x="62" y="159" font-size="12" fill="#59636e">MB/s · higher is better</text><text x="62" y="188" font-size="13" fill="#59636e">Toolbox as it ships</text><text x="404" y="188" font-size="15" text-anchor="end" font-weight="600" fill="#3d444d">1.5</text><rect x="62" y="198" width="342" height="22" rx="11" fill="#e9edf1"/><rect class="bar" x="62" y="198" width="60.4" height="22" rx="11" fill="#5B8FF9" style="animation-delay:0.10s"/><text x="62" y="250" font-size="13" fill="#3d444d">jtaccel, 16 streams</text><text x="404" y="250" font-size="15" text-anchor="end" font-weight="700" fill="#1f2328">8.5</text><rect x="62" y="260" width="342" height="22" rx="11" fill="#e9edf1"/><rect class="bar" x="62" y="260" width="342.0" height="22" rx="11" fill="url(#blightf)" style="animation-delay:0.22s"/><clipPath id="blight01c"><rect x="62" y="260" width="342.00" height="22" rx="11.0"/></clipPath><g clip-path="url(#blight01c)"><g class="flow" style="--period:24px;--dur:0.7s" stroke="#fff" stroke-opacity="0.15" stroke-width="6" fill="none"><path d="M14.0 260 L-8.0 282"/><path d="M38.0 260 L16.0 282"/><path d="M62.0 260 L40.0 282"/><path d="M86.0 260 L64.0 282"/><path d="M110.0 260 L88.0 282"/><path d="M134.0 260 L112.0 282"/><path d="M158.0 260 L136.0 282"/><path d="M182.0 260 L160.0 282"/><path d="M206.0 260 L184.0 282"/><path d="M230.0 260 L208.0 282"/><path d="M254.0 260 L232.0 282"/><path d="M278.0 260 L256.0 282"/><path d="M302.0 260 L280.0 282"/><path d="M326.0 260 L304.0 282"/><path d="M350.0 260 L328.0 282"/><path d="M374.0 260 L352.0 282"/><path d="M398.0 260 L376.0 282"/><path d="M422.0 260 L400.0 282"/><path d="M446.0 260 L424.0 282"/><path d="M470.0 260 L448.0 282"/></g></g><text x="62" y="368" font-size="12" fill="#59636e">≈ 5.7× on the same file, same line</text><rect x="453" y="104" width="386" height="286" rx="14" fill="#f6f8fa" stroke="#d1d9e0"/><text x="475" y="138" font-size="15" font-weight="700" fill="#1f2328">Same CDN, more connections</text><text x="475" y="159" font-size="12" fill="#59636e">MB/s · higher is better</text><text x="475" y="188" font-size="13" fill="#59636e">1 connection</text><text x="817" y="188" font-size="15" text-anchor="end" font-weight="600" fill="#3d444d">2.3</text><rect x="475" y="198" width="342" height="22" rx="11" fill="#e9edf1"/><rect class="bar" x="475" y="198" width="92.5" height="22" rx="11" fill="#5B8FF9" style="animation-delay:0.18s"/><text x="475" y="250" font-size="13" fill="#59636e">6 connections</text><text x="817" y="250" font-size="15" text-anchor="end" font-weight="600" fill="#3d444d">7.8</text><rect x="475" y="260" width="342" height="22" rx="11" fill="#e9edf1"/><rect class="bar" x="475" y="260" width="313.8" height="22" rx="11" fill="#5B8FF9" style="animation-delay:0.30s"/><text x="475" y="312" font-size="13" fill="#59636e">line capacity</text><text x="817" y="312" font-size="15" text-anchor="end" font-weight="600" fill="#3d444d">8.5</text><rect x="475" y="322" width="342" height="22" rx="11" fill="#e9edf1"/><rect x="475.75" y="322.75" width="340.5" height="20.5" rx="10.25" fill="none" stroke="#59636e" stroke-width="1.5" stroke-dasharray="5 4"/><text x="475" y="368" font-size="12" fill="#59636e">the pipe was never the limit — one stream was</text><rect x="866" y="104" width="386" height="286" rx="14" fill="#f6f8fa" stroke="#d1d9e0"/><text x="888" y="138" font-size="15" font-weight="700" fill="#1f2328">Time to first byte by segment</text><text x="888" y="159" font-size="12" fill="#59636e">seconds · lower is better</text><text x="888" y="188" font-size="13" fill="#59636e">8 MiB segments</text><text x="1230" y="188" font-size="15" text-anchor="end" font-weight="600" fill="#3d444d">16.0 s</text><rect x="888" y="198" width="342" height="22" rx="11" fill="#e9edf1"/><rect class="bar" x="888" y="198" width="342.0" height="22" rx="11" fill="#5B8FF9" style="animation-delay:0.26s"/><text x="888" y="250" font-size="13" fill="#3d444d">1 MiB segments</text><text x="1230" y="250" font-size="15" text-anchor="end" font-weight="700" fill="#1f2328">0.94 s</text><rect x="888" y="260" width="342" height="22" rx="11" fill="#e9edf1"/><rect class="bar" x="888" y="260" width="20.1" height="22" rx="11" fill="url(#blightf)" style="animation-delay:0.38s"/><clipPath id="blight21c"><rect x="888" y="260" width="20.09" height="22" rx="11.0"/></clipPath><g clip-path="url(#blight21c)"><g class="flow" style="--period:24px;--dur:0.7s" stroke="#fff" stroke-opacity="0.15" stroke-width="6" fill="none"><path d="M840.0 260 L818.0 282"/><path d="M864.0 260 L842.0 282"/><path d="M888.0 260 L866.0 282"/><path d="M912.0 260 L890.0 282"/><path d="M936.0 260 L914.0 282"/><path d="M960.0 260 L938.0 282"/></g></g><text x="888" y="368" font-size="12" fill="#59636e">1 MiB is the shipped default</text></g></svg>
