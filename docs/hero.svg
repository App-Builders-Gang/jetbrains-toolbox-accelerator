<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" font-family="'Segoe UI',system-ui,-apple-system,sans-serif" role="img" aria-label="jtaccel makes JetBrains Toolbox download 5.7 times faster by splitting each download into parallel streams">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101015"/>
      <stop offset="1" stop-color="#0a0a0c"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.72" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#2a78d6" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#2a78d6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="barFast" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1c5cab"/>
      <stop offset="1" stop-color="#3987e5"/>
    </linearGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2a78d6"/>
      <stop offset="1" stop-color="#6da7ec"/>
    </linearGradient>
  </defs>

  <!-- canvas -->
  <rect width="1200" height="560" rx="22" fill="url(#bg)"/>
  <rect width="1200" height="560" rx="22" fill="url(#glow)"/>
  <rect x="1" y="1" width="1198" height="558" rx="21" fill="none" stroke="#ffffff" stroke-opacity="0.06"/>

  <!-- logo mark: three parallel streams converging into one arrow -->
  <g transform="translate(72,70)">
    <rect x="0"  y="6"  width="26" height="6" rx="3" fill="url(#mark)"/>
    <rect x="0"  y="19" width="26" height="6" rx="3" fill="url(#mark)" opacity="0.78"/>
    <rect x="0"  y="32" width="26" height="6" rx="3" fill="url(#mark)" opacity="0.56"/>
    <path d="M30 22 h44" stroke="#3987e5" stroke-width="6" stroke-linecap="round"/>
    <path d="M66 12 l14 10 l-14 10" fill="none" stroke="#6da7ec" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="96" y="33" font-size="34" font-weight="700" fill="#ffffff" letter-spacing="-0.5">jtaccel</text>
  </g>
  <text x="72" y="148" font-size="19" fill="#c3c2b7">Full-speed downloads for JetBrains Toolbox</text>

  <!-- speed comparison -->
  <g transform="translate(72,200)" font-size="16">
    <!-- before -->
    <text x="0" y="0" fill="#898781">Toolbox, single stream</text>
    <text x="1056" y="0" fill="#898781" text-anchor="end">1.5 MB/s</text>
    <rect x="0" y="10" width="186" height="30" rx="6" fill="#2c2c2a"/>
    <!-- after -->
    <text x="0" y="86" fill="#e6e6e0" font-weight="600">jtaccel, 16 parallel streams</text>
    <text x="1056" y="86" fill="#ffffff" font-weight="700" text-anchor="end">8.5 MB/s</text>
    <rect x="0" y="96" width="1056" height="30" rx="6" fill="url(#barFast)"/>

    <!-- delta -->
    <g transform="translate(0,160)">
      <rect x="0" y="0" width="218" height="44" rx="10" fill="#0ca30c" fill-opacity="0.14" stroke="#0ca30c" stroke-opacity="0.5"/>
      <text x="18" y="29" font-size="20" font-weight="700" fill="#3dd64d">≈ 5.7× faster</text>
      <text x="250" y="29" font-size="15" fill="#898781">same file · same checksum · byte-exact</text>
    </g>
  </g>

  <!-- install pill -->
  <g transform="translate(72,468)">
    <rect x="0" y="0" width="1056" height="56" rx="12" fill="#000000" fill-opacity="0.45" stroke="#ffffff" stroke-opacity="0.08"/>
    <circle cx="28" cy="28" r="6" fill="#0ca30c"/>
    <text x="50" y="34" font-size="14.5" fill="#e6e6e0" font-family="'Cascadia Code',ui-monospace,'SF Mono',Consolas,monospace">$ curl -fsSL github.com/App-Builders-Gang/jetbrains-toolbox-accelerator/releases/latest/download/install.sh | sh</text>
  </g>
</svg>
