<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 560" width="1280" height="560" role="img" aria-labelledby="ttl dsc"><title id="ttl">How jtaccel accelerates a JetBrains Toolbox download</title><desc id="dsc">Toolbox connects to the local jtaccel proxy. Authentication hosts are tunnelled blind and never decrypted. Any response of at least 32 MiB that advertises Accept-Ranges is re-fetched as 16 parallel ranged GETs of 1 MiB each and reassembled in order, so the bytes Toolbox receives are identical.</desc><style>@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}@keyframes flow{to{transform:translateX(var(--period))}}@keyframes fade{from{opacity:0}to{opacity:1}}@keyframes pkt{to{stroke-dashoffset:-150}}.bar{transform-box:fill-box;transform-origin:left center;animation:grow 1.5s cubic-bezier(.22,.9,.25,1) both}.flow{animation:flow var(--dur) linear infinite}.fade{animation:fade .8s ease-out both}.pkt{animation:pkt 1.2s linear infinite}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Roboto,'Helvetica Neue',Arial,sans-serif"><defs><linearGradient id="adarkT" gradientUnits="userSpaceOnUse" x1="-8.82" y1="4.57" x2="155.25" y2="-80.33"><stop offset="0" stop-color="#FF4055"/><stop offset="0.2" stop-color="#FC2771"/><stop offset="0.4" stop-color="#EA2291"/><stop offset="0.6" stop-color="#D620B3"/><stop offset="0.8" stop-color="#C31FD2"/><stop offset="1" stop-color="#B51EEB"/></linearGradient><linearGradient id="adarkL" gradientUnits="userSpaceOnUse" x1="48.73" y1="-25.21" x2="-57.8" y2="29.91"><stop offset="0" stop-color="#F6237E"/><stop offset="0.2" stop-color="#FD276E"/><stop offset="0.4" stop-color="#FF4056"/><stop offset="0.6" stop-color="#FF5B3E"/><stop offset="0.8" stop-color="#FF7626"/><stop offset="1" stop-color="#FF8618"/></linearGradient><linearGradient id="adarkR" gradientUnits="userSpaceOnUse" x1="197.62" y1="219.02" x2="121.11" y2="134.22"><stop offset="0" stop-color="#060008"/><stop offset="0.2" stop-color="#0A000B"/><stop offset="0.4" stop-color="#130116"/><stop offset="0.6" stop-color="#220126"/><stop offset="0.8" stop-color="#38023E"/><stop offset="1" stop-color="#4A0251"/></linearGradient><linearGradient id="adarktT" gradientUnits="userSpaceOnUse" x1="-8.82" y1="4.57" x2="155.25" y2="-80.33"><stop offset="0" stop-color="#FF4055"/><stop offset="0.2" stop-color="#FC2771"/><stop offset="0.4" stop-color="#EA2291"/><stop offset="0.6" stop-color="#D620B3"/><stop offset="0.8" stop-color="#C31FD2"/><stop offset="1" stop-color="#B51EEB"/></linearGradient><linearGradient id="adarktL" gradientUnits="userSpaceOnUse" x1="48.73" y1="-25.21" x2="-57.8" y2="29.91"><stop offset="0" stop-color="#F6237E"/><stop offset="0.2" stop-color="#FD276E"/><stop offset="0.4" stop-color="#FF4056"/><stop offset="0.6" stop-color="#FF5B3E"/><stop offset="0.8" stop-color="#FF7626"/><stop offset="1" stop-color="#FF8618"/></linearGradient><linearGradient id="adarktR" gradientUnits="userSpaceOnUse" x1="197.62" y1="219.02" x2="121.11" y2="134.22"><stop offset="0" stop-color="#060008"/><stop offset="0.2" stop-color="#0A000B"/><stop offset="0.4" stop-color="#130116"/><stop offset="0.6" stop-color="#220126"/><stop offset="0.8" stop-color="#38023E"/><stop offset="1" stop-color="#4A0251"/></linearGradient><marker id="adarkar" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#7d8590"/></marker><marker id="adarkarA" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#FC2771"/></marker></defs><rect width="1280" height="560" rx="18" fill="#0d1117"/><rect x=".5" y=".5" width="1279" height="559" rx="17.5" fill="none" stroke="#30363d"/><text x="48" y="56" font-size="20" font-weight="700" fill="#e6edf3">How a Toolbox download actually gets faster</text><text x="48" y="82" font-size="14.5" fill="#7d8590">Acceleration is decided per response, so it works on any CDN — there is no host allow-list to maintain.</text><text x="116" y="212" font-size="15" font-weight="650" text-anchor="middle" fill="#e6edf3">JetBrains Toolbox</text><text x="116" y="231" font-size="13" text-anchor="middle" fill="#7d8590">unmodified</text><g transform="translate(64.31,240.77) scale(0.40385)"><polygon points="128,8 232,68 128,128 24,68" fill="url(#adarktT)"/><polygon points="24,68 128,128 128,248 24,188" fill="url(#adarktL)"/><polygon points="128,128 232,68 232,188 128,248" fill="url(#adarktR)"/><polygon points="149,199 192,174 192,186 149,211" fill="#fff"/></g><path d="M170 292 L322 292" stroke="#7d8590" stroke-width="1.6" fill="none" marker-end="url(#adarkar)"/><text x="246" y="282" font-size="12.5" text-anchor="middle" fill="#7d8590" font-family="ui-monospace,SFMono-Regular,'SF Mono','Cascadia Code','Roboto Mono',Menlo,Consolas,monospace">CONNECT</text><rect x="332" y="150" width="316" height="256" rx="14" fill="#161b22" stroke="#30363d"/><g transform="translate(349.00,169.00) scale(0.12500)"><polygon points="128,8 232,68 128,128 24,68" fill="url(#adarkT)"/><polygon points="24,68 128,128 128,248 24,188" fill="url(#adarkL)"/><polygon points="128,128 232,68 232,188 128,248" fill="url(#adarkR)"/><g fill="#fff"><polygon points="144.1,149.3 190.4,122.6 190.4,133.2 144.1,159.9"/><polygon points="144.1,169.7 182.1,147.8 182.1,158.4 144.1,180.3"/><polygon points="144.1,190.1 173.8,173.0 173.8,183.6 144.1,200.7"/></g><path d="M198.2 119.8 L216.9 133.0 L198.2 167.8" fill="none" stroke="#fff" stroke-width="11.5" stroke-linecap="round" stroke-linejoin="round"/></g><text x="388" y="191" font-size="16" font-weight="750" fill="#e6edf3">jtaccel</text><text x="630" y="191" font-size="12.5" text-anchor="end" fill="#7d8590" font-family="ui-monospace,SFMono-Regular,'SF Mono','Cascadia Code','Roboto Mono',Menlo,Consolas,monospace">127.0.0.1:8899</text><line x1="332" y1="208" x2="648" y2="208" stroke="#30363d"/><circle cx="358" cy="237" r="4.5" fill="#FC2771"/><text x="374" y="242" font-size="14" font-weight="650" fill="#e6edf3">large + rangeable</text><text x="374" y="262" font-size="12.5" fill="#7d8590">split into 16 ranged GETs</text><circle cx="358" cy="299" r="4.5" fill="#5B8FF9"/><text x="374" y="304" font-size="14" font-weight="650" fill="#b6c2cf">auth / OAuth hosts</text><text x="374" y="324" font-size="12.5" fill="#7d8590">blind TCP splice, never decrypted</text><circle cx="358" cy="361" r="4.5" fill="#7d8590"/><text x="374" y="366" font-size="14" font-weight="650" fill="#b6c2cf">everything else</text><text x="374" y="386" font-size="12.5" fill="#7d8590">relayed verbatim</text><path d="M648 184.0 C797 184.0 797 212.0 946 212.0" fill="none" stroke="#FC2771" stroke-opacity=".20" stroke-width="1.2"/><path d="M648 184.0 C797 184.0 797 212.0 946 212.0" fill="none" stroke="#FC2771" stroke-opacity=".95" stroke-width="2.2" stroke-linecap="round" stroke-dasharray="22 128" stroke-dashoffset="0.0" class="pkt" style="animation-delay:0.000s"/><path d="M648 196.5 C797 196.5 797 220.8 946 220.8" fill="none" stroke="#FC2771" stroke-opacity=".20" stroke-width="1.2"/><path d="M648 196.5 C797 196.5 797 220.8 946 220.8" fill="none" stroke="#FC2771" stroke-opacity=".95" stroke-width="2.2" stroke-linecap="round" stroke-dasharray="22 128" stroke-dashoffset="-9.4" class="pkt" style="animation-delay:-0.075s"/><path d="M648 209.1 C797 209.1 797 229.6 946 229.6" fill="none" stroke="#FC2771" stroke-opacity=".20" stroke-width="1.2"/><path d="M648 209.1 C797 209.1 797 229.6 946 229.6" fill="none" stroke="#FC2771" stroke-opacity=".95" stroke-width="2.2" stroke-linecap="round" stroke-dasharray="22 128" stroke-dashoffset="-18.8" class="pkt" style="animation-delay:-0.150s"/><path d="M648 221.6 C797 221.6 797 238.4 946 238.4" fill="none" stroke="#FC2771" stroke-opacity=".20" stroke-width="1.2"/><path d="M648 221.6 C797 221.6 797 238.4 946 238.4" fill="none" stroke="#FC2771" stroke-opacity=".95" stroke-width="2.2" stroke-linecap="round" stroke-dasharray="22 128" stroke-dashoffset="-28.2" class="pkt" style="animation-delay:-0.225s"/><path d="M648 234.1 C797 234.1 797 247.2 946 247.2" fill="none" stroke="#FC2771" stroke-opacity=".20" stroke-width="1.2"/><path d="M648 234.1 C797 234.1 797 247.2 946 247.2" fill="none" stroke="#FC2771" stroke-opacity=".95" stroke-width="2.2" stroke-linecap="round" stroke-dasharray="22 128" stroke-dashoffset="-37.6" class="pkt" style="animation-delay:-0.300s"/><path d="M648 246.7 C797 246.7 797 256.0 946 256.0" fill="none" stroke="#FC2771" stroke-opacity=".20" stroke-width="1.2"/><path d="M648 246.7 C797 246.7 797 256.0 946 256.0" fill="none" stroke="#FC2771" stroke-opacity=".95" stroke-width="2.2" stroke-linecap="round" stroke-dasharray="22 128" stroke-dashoffset="-47.0" class="pkt" style="animation-delay:-0.375s"/><path d="M648 259.2 C797 259.2 797 264.8 946 264.8" fill="none" stroke="#FC2771" stroke-opacity=".20" stroke-width="1.2"/><path d="M648 259.2 C797 259.2 797 264.8 946 264.8" fill="none" stroke="#FC2771" stroke-opacity=".95" stroke-width="2.2" stroke-linecap="round" stroke-dasharray="22 128" stroke-dashoffset="-56.4" class="pkt" style="animation-delay:-0.450s"/><path d="M648 271.7 C797 271.7 797 273.6 946 273.6" fill="none" stroke="#FC2771" stroke-opacity=".20" stroke-width="1.2"/><path d="M648 271.7 C797 271.7 797 273.6 946 273.6" fill="none" stroke="#FC2771" stroke-opacity=".95" stroke-width="2.2" stroke-linecap="round" stroke-dasharray="22 128" stroke-dashoffset="-65.8" class="pkt" style="animation-delay:-0.525s"/><path d="M648 284.3 C797 284.3 797 282.4 946 282.4" fill="none" stroke="#FC2771" stroke-opacity=".20" stroke-width="1.2"/><path d="M648 284.3 C797 284.3 797 282.4 946 282.4" fill="none" stroke="#FC2771" stroke-opacity=".95" stroke-width="2.2" stroke-linecap="round" stroke-dasharray="22 128" stroke-dashoffset="-75.2" class="pkt" style="animation-delay:-0.600s"/><path d="M648 296.8 C797 296.8 