city=".95" stroke-width="2.2" stroke-linecap="round" stroke-dasharray="22 128" stroke-dashoffset="-131.6" class="pkt" style="animation-delay:-1.050s"/><path d="M648 372.0 C797 372.0 797 344.0 946 344.0" fill="none" stroke="#FC2771" stroke-opacity=".20" stroke-width="1.2"/><path d="M648 372.0 C797 372.0 797 344.0 946 344.0" fill="none" stroke="#FC2771" stroke-opacity=".95" stroke-width="2.2" stroke-linecap="round" stroke-dasharray="22 128" stroke-dashoffset="-141.0" class="pkt" style="animation-delay:-1.125s"/><text x="797" y="150" font-size="13.5" font-weight="650" text-anchor="middle" fill="#FC2771">16 parallel ranged GETs</text><text x="797" y="170" font-size="12.5" text-anchor="middle" fill="#7d8590" font-family="ui-monospace,SFMono-Regular,'SF Mono','Cascadia Code','Roboto Mono',Menlo,Consolas,monospace">Range: bytes=… · 1 MiB segments</text><rect x="946" y="196" width="262" height="164" rx="14" fill="#161b22" stroke="#30363d"/><text x="966" y="230" font-size="15" font-weight="700" fill="#e6edf3">Origin CDN</text><text x="966" y="256" font-size="12.5" fill="#7d8590" font-family="ui-monospace,SFMono-Regular,'SF Mono','Cascadia Code','Roboto Mono',Menlo,Consolas,monospace">download.jetbrains.com</text><text x="966" y="277" font-size="12.5" fill="#7d8590" font-family="ui-monospace,SFMono-Regular,'SF Mono','Cascadia Code','Roboto Mono',Menlo,Consolas,monospace">edgedl.me.gvt1.com</text><text x="966" y="298" font-size="12.5" fill="#7d8590" font-family="ui-monospace,SFMono-Regular,'SF Mono','Cascadia Code','Roboto Mono',Menlo,Consolas,monospace">plugins.jetbrains.com</text><text x="966" y="336" font-size="12.5" font-weight="600" fill="#5B8FF9" font-family="ui-monospace,SFMono-Regular,'SF Mono','Cascadia Code','Roboto Mono',Menlo,Consolas,monospace">Accept-Ranges: bytes</text><path d="M490.0 406 L490.0 478 L116 478 L116 356" fill="none" stroke="#FC2771" stroke-width="2" marker-end="url(#adarkarA)"/><rect x="196" y="456" width="330" height="44" rx="12" fill="#1c2128" stroke="#30363d"/><text x="361" y="484" font-size="14" font-weight="650" text-anchor="middle" fill="#e6edf3">ordered reassembly → byte-exact stream</text><text x="558" y="484" font-size="13" fill="#7d8590">Toolbox’s own SHA-256 verification passes unchanged</text></g></svg>
