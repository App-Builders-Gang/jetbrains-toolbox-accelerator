<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="jtaccel logo: an isometric JetBrains Toolbox-style cube whose face carries three parallel download streams and a forward chevron">
  <title>jtaccel</title>
  <!--
    jtaccel mark — a derivative of the JetBrains Toolbox cube. Face geometry and the
    three gradients were measured from the installed Toolbox app icon, so the cube is
    the real one; Toolbox's single white bar is replaced by three tapering parallel
    streams and an acceleration chevron.
    JetBrains and the Toolbox logo are trademarks of JetBrains s.r.o.
  -->
  <defs>
    <linearGradient id="jtTop" gradientUnits="userSpaceOnUse" x1="-8.82" y1="4.57" x2="155.25" y2="-80.33">
      <stop offset="0" stop-color="#FF4055"/>
      <stop offset=".2" stop-color="#FC2771"/>
      <stop offset=".4" stop-color="#EA2291"/>
      <stop offset=".6" stop-color="#D620B3"/>
      <stop offset=".8" stop-color="#C31FD2"/>
      <stop offset="1" stop-color="#B51EEB"/>
    </linearGradient>
    <linearGradient id="jtLeft" gradientUnits="userSpaceOnUse" x1="48.73" y1="-25.21" x2="-57.80" y2="29.91">
      <stop offset="0" stop-color="#F6237E"/>
      <stop offset=".2" stop-color="#FD276E"/>
      <stop offset=".4" stop-color="#FF4056"/>
      <stop offset=".6" stop-color="#FF5B3E"/>
      <stop offset=".8" stop-color="#FF7626"/>
      <stop offset="1" stop-color="#FF8618"/>
    </linearGradient>
    <linearGradient id="jtRight" gradientUnits="userSpaceOnUse" x1="197.62" y1="219.02" x2="121.11" y2="134.22">
      <stop offset="0" stop-color="#060008"/>
      <stop offset=".2" stop-color="#0A000B"/>
      <stop offset=".4" stop-color="#130116"/>
      <stop offset=".6" stop-color="#220126"/>
      <stop offset=".8" stop-color="#38023E"/>
      <stop offset="1" stop-color="#4A0251"/>
    </linearGradient>
  </defs>

  <polygon points="128,8 232,68 128,128 24,68" fill="url(#jtTop)"/>
  <polygon points="24,68 128,128 128,248 24,188" fill="url(#jtLeft)"/>
  <polygon points="128,128 232,68 232,188 128,248" fill="url(#jtRight)"/>

  <g fill="#FFFFFF">
    <polygon points="144.1,149.3 190.4,122.6 190.4,133.2 144.1,159.9"/>
    <polygon points="144.1,169.7 182.1,147.8 182.1,158.4 144.1,180.3"/>
    <polygon points="144.1,190.1 173.8,173.0 173.8,183.6 144.1,200.7"/>
  </g>
  <path d="M198.2 119.8 L216.9 133.0 L198.2 167.8" fill="none" stroke="#FFFFFF"
        stroke-width="11.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
