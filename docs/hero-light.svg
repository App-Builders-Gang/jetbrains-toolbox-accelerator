<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 470" width="1280" height="470" role="img" aria-labelledby="ttl dsc"><title id="ttl">jtaccel — full-speed downloads for JetBrains Toolbox</title><desc id="dsc">JetBrains Toolbox downloading over one connection reaches 1.5 MB/s; with jtaccel splitting the same download across 16 parallel streams it reaches 8.5 MB/s, about 5.7 times faster, with byte-identical output.</desc><style>@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}@keyframes flow{to{transform:translateX(var(--period))}}@keyframes fade{from{opacity:0}to{opacity:1}}@keyframes pkt{to{stroke-dashoffset:-150}}.bar{transform-box:fill-box;transform-origin:left center;animation:grow 1.5s cubic-bezier(.22,.9,.25,1) both}.flow{animation:flow var(--dur) linear infinite}.fade{animation:fade .8s ease-out both}.pkt{animation:pkt 1.2s linear infinite}.b2{animation-delay:.35s}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Roboto,'Helvetica Neue',Arial,sans-serif"><defs><linearGradient id="hlightT" gradientUnits="userSpaceOnUse" x1="-8.82" y1="4.57" x2="155.25" y2="-80.33"><stop offset="0" stop-color="#FF4055"/><stop offset="0.2" stop-color="#FC2771"/><stop offset="0.4" stop-color="#EA2291"/><stop offset="0.6" stop-color="#D620B3"/><stop offset="0.8" stop-color="#C31FD2"/><stop offset="1" stop-color="#B51EEB"/></linearGradient><linearGradient id="hlightL" gradientUnits="userSpaceOnUse" x1="48.73" y1="-25.21" x2="-57.8" y2="29.91"><stop offset="0" stop-color="#F6237E"/><stop offset="0.2" stop-color="#FD276E"/><stop offset="0.4" stop-color="#FF4056"/><stop offset="0.6" stop-color="#FF5B3E"/><stop offset="0.8" stop-color="#FF7626"/><stop offset="1" stop-color="#FF8618"/></linearGradient><linearGradient id="hlightR" gradientUnits="userSpaceOnUse" x1="197.62" y1="219.02" x2="121.11" y2="134.22"><stop offset="0" stop-color="#060008"/><stop offset="0.2" stop-color="#0A000B"/><stop offset="0.4" stop-color="#130116"/><stop offset="0.6" stop-color="#220126"/><stop offset="0.8" stop-color="#38023E"/><stop offset="1" stop-color="#4A0251"/></linearGradient><radialGradient id="hlightglow" cx=".78" cy=".18" r=".62"><stop offset="0" stop-color="#FC2771" stop-opacity="0.13"/><stop offset="1" stop-color="#FC2771" stop-opacity="0"/></radialGradient><linearGradient id="hlightfast" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FF8618"/><stop offset=".55" stop-color="#FC2771"/><stop offset="1" stop-color="#B51EEB"/></linearGradient></defs><rect width="1280" height="470" rx="18" fill="#ffffff"/><rect width="1280" height="470" rx="18" fill="url(#hlightglow)"/><rect x=".5" y=".5" width="1279" height="469" rx="17.5" fill="none" stroke="#d1d9e0"/><g transform="translate(55.46,37.15) scale(0.35577)"><polygon points="128,8 232,68 128,128 24,68" fill="url(#hlightT)"/><polygon points="24,68 128,128 128,248 24,188" fill="url(#hlightL)"/><polygon points="128,128 232,68 232,188 128,248" fill="url(#hlightR)"/><g fill="#fff"><polygon points="144.1,149.3 190.4,122.6 190.4,133.2 144.1,159.9"/><polygon points="144.1,169.7 182.1,147.8 182.1,158.4 144.1,180.3"/><polygon points="144.1,190.1 173.8,173.0 173.8,183.6 144.1,200.7"/></g><path d="M198.2 119.8 L216.9 133.0 L198.2 167.8" fill="none" stroke="#fff" stroke-width="11.5" stroke-linecap="round" stroke-linejoin="round"/></g><text x="164" y="106" font-size="56" font-weight="800" fill="#1f2328" letter-spacing="-1.8">jtaccel</text><text x="64" y="164" font-size="29" font-weight="650" fill="#1f2328">Full-speed downloads for JetBrains Toolbox</text><text x="64" y="197" font-size="16.5" fill="#59636e">A local proxy that splits every large Toolbox download into 16 parallel streams — and reassembles them byte-for-byte.</text><text x="64" y="250" font-size="13.5" font-weight="600" letter-spacing=".7" fill="#59636e">TOOLBOX AS IT SHIPS — ONE CONNECTION</text><rect x="64" y="262" width="940" height="30" rx="15" fill="#e9edf1"/><rect class="bar b1" x="64" y="262" width="165.9" height="30" rx="15" fill="#5B8FF9"/><clipPath id="hlightb1c"><rect x="64" y="262" width="165.88" height="30" rx="15.0"/></clipPath><g clip-path="url(#hlightb1c)"><g class="flow" style="--period:26px;--dur:3.6s" stroke="#fff" stroke-opacity="0.16" stroke-width="6" fill="none"><path d="M12.0 262 L-18.0 292"/><path d="M38.0 262 L8.0 292"/><path d="M64.0 262 L34.0 292"/><path d="M90.0 262 L60.0 292"/><path d="M116.0 262 L86.0 292"/><path d="M142.0 262 L112.0 292"/><path d="M168.0 262 L138.0 292"/><path d="M194.0 262 L164.0 292"/><path d="M220.0 262 L190.0 292"/><path d="M246.0 262 L216.0 292"/><path d="M272.0 262 L242.0 292"/><path d="M298.0 262 L268.0 292"/></g></g><text x="1216" y="284" font-size="21" text-anchor="end" font-weight="600" fill="#3d444d">1.5 MB/s</text><text x="64" y="330" font-size="13.5" font-weight="600" letter-spacing=".7" fill="#59636e">WITH JTACCEL — 16 PARALLEL STREAMS</text><rect x="64" y="342" width="940" height="30" rx="15" fill="#e9edf1"/><rect class="bar b2" x="64" y="342" width="940.0" height="30" rx="15" fill="url(#hlightfast)"/><clipPath id="hlightb2c"><rect x="64" y="342" width="940.00" height="30" rx="15.0"/></clipPath><g clip-path="url(#hlightb2c)"><g class="flow" style="--period:26px;--dur:0.62s" stroke="#fff" stroke-opacity="0.16" stroke-width="6" fill="none"><path d="M12.0 342 L-18.0 372"/><path d="M38.0 342 L8.0 372"/><path d="M64.0 342 L34.0 372"/><path d="M90.0 342 L60.0 372"/><path d="M116.0 342 L86.0 372"/><path d="M142.0 342 L112.0 372"/><path d="M168.0 342 L138.0 372"/><path d="M194.0 342 L164.0 372"/><path d="M220.0 342 L190.0 372"/><path d="M246.0 342 L216.0 372"/><path d="M272.0 342 L242.0 372"/><path d="M298.0 342 L268.0 372"/><path d="M324.0 342 L294.0 372"/><path d="M350.0 342 L320.0 372"/><path d="M376.0 342 L346.0 372"/><path d="M402.0 342 L372.0 372"/><path d="M428.0 342 L398.0 372"/><path d="M454.0 342 L424.0 372"/><path d="M480.0 342 L450.0 372