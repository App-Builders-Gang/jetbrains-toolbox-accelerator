<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" font-family="'Segoe UI',system-ui,-apple-system,sans-serif" role="img" aria-label="jtaccel logo">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101015"/>
      <stop offset="1" stop-color="#0a0a0c"/>
    </linearGradient>
    <radialGradient id="glow3" cx="0.5" cy="0.45" r="0.5">
      <stop offset="0" stop-color="#2a78d6" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#2a78d6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mark3" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2a78d6"/>
      <stop offset="1" stop-color="#6da7ec"/>
    </linearGradient>
  </defs>
  <rect width="640" height="640" rx="0" fill="url(#bg3)"/>
  <rect width="640" height="640" rx="0" fill="url(#glow3)"/>

  <!-- mark: three streams converging into an arrow -->
  <g transform="translate(150,250)">
    <rect x="0"  y="0"  width="92" height="22" rx="11" fill="url(#mark3)"/>
    <rect x="0"  y="44" width="92" height="22" rx="11" fill="url(#mark3)" opacity="0.78"/>
    <rect x="0"  y="88" width="92" height="22" rx="11" fill="url(#mark3)" opacity="0.56"/>
    <path d="M104 66 h150" stroke="#3987e5" stroke-width="22" stroke-linecap="round" stroke-opacity="0.0"/>
    <path d="M104 66 h120" stroke="#3987e5" stroke-width="14" stroke-linecap="round"/>
    <path d="M210 46 l40 20 l-40 20" fill="none" stroke="#6da7ec" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <text x="320" y="470" text-anchor="middle" font-size="86" font-weight="800" fill="#ffffff" letter-spacing="-2">jtaccel</text>
  <text x="320" y="524" text-anchor="middle" font-size="24" fill="#898781" letter-spacing="0.5">JetBrains Toolbox accelerator</text>
</svg>
